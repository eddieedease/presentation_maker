<div class="relative h-screen w-screen overflow-hidden bg-black">
  @if (loading()) {
    <div class="grid h-full place-content-center text-center">
      <div class="mx-auto h-8 w-8 animate-spin rounded-full border-2 border-white/15 border-t-indigo-400"></div>
      <p class="mt-4 text-sm text-slate-500">Loading presentation…</p>
    </div>
  } @else if (error(); as message) {
    <div class="grid h-full place-content-center px-6 text-center">
      <div class="mx-auto mb-4 grid h-14 w-14 place-items-center rounded-xl bg-white/5 text-2xl">🔒</div>
      <h1 class="text-xl font-semibold text-white">Presentation unavailable</h1>
      <p class="mx-auto mt-2 max-w-sm text-sm text-slate-400">{{ message }}</p>
      <a routerLink="/" class="btn-primary mx-auto mt-6">Go to Presentation Maker</a>
    </div>
  } @else if (presentation(); as published) {
    <app-reveal-deck [deck]="published.deck" [enableHash]="true" />

    <!-- Arrival chrome: fades away so it never covers the deck -->
    <div
      class="pointer-events-none fixed top-0 right-0 left-0 z-20 flex items-start justify-between gap-4 bg-gradient-to-b from-black/70 to-transparent px-5 py-4 transition-opacity duration-700"
      [class.opacity-0]="!chromeVisible()"
      (mouseenter)="chromeVisible.set(true)"
    >
      <div>
        <p class="text-sm font-semibold text-white">{{ published.title }}</p>
        <p class="text-xs text-slate-400">by {{ published.author }}</p>
      </div>
      <div class="pointer-events-auto flex items-center gap-2">
        <button type="button" class="btn-ghost px-3 py-1.5 text-xs" (click)="enterFullscreen()">Fullscreen</button>
        <a routerLink="/" class="btn-ghost px-3 py-1.5 text-xs">Made with Presentation Maker</a>
      </div>
    </div>

    <!-- Hover zone to bring the chrome back -->
    <div class="fixed top-0 right-0 left-0 z-10 h-16" (mouseenter)="chromeVisible.set(true)" (mouseleave)="chromeVisible.set(false)"></div>
  }
</div>
