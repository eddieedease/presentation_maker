services:
  db:
    image: mysql:8.4
    container_name: presmaker-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_NAME:-presmaker}
      MYSQL_USER: ${DB_USER:-presmaker}
      MYSQL_PASSWORD: ${DB_PASSWORD:-presmaker}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      # Development only. The web installer never loads this file.
      - ./backend/database/seed-dev.sql:/docker-entrypoint-initdb.d/002-seed-dev.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: presmaker-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-presmaker}
      DB_USER: ${DB_USER:-presmaker}
      DB_PASSWORD: ${DB_PASSWORD:-presmaker}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-a5f3c1}
      JWT_ISSUER: ${JWT_ISSUER:-presmaker-api}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-900}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-1209600}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:4200}
      APP_INSTALLER_DISABLED: "1"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/auth/oauth/google/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8080/api/auth/oauth/github/callback}
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html

  phpmyadmin:
    image: phpmyadmin:5
    container_name: presmaker-pma
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-presmaker}
      PMA_PASSWORD: ${DB_PASSWORD:-presmaker}
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8081}:80"

volumes:
  db_data:
